#        - id: custom_route
#          uri: http://backend-service
#          predicates:
#            - Path=/api/**
#            - Token=Authorization,Bearer
      globalcors:
        cors-configurations:
          '[/**]':
            # 授信地址列表
            allowed-origins:
              - "http://localhost:10000"
              - "https://www.baidu.com"
            # cookie, authorization认证信息
            exposed-headers: "*"
            allowed-methods: "*"
            allow-credentials: true
            allowed-headers: "*"
#        add-to-simple-url-handler-mapping: true
  sleuth:
    sampler:
      probability: 1
      rate: 1000

management:
  endpoints:
    web:
      exposure:
        include: "*"


