#          uri: lb://service-a
#          order: 1
#          predicates:
#            - Path=/gateway/service-a/**
#          filters:
#            - StripPrefix=1
#
#        # 路由3：百度路由
#        - id: id-001
#          uri: http://www.baidu.com
#          predicates:
#            - Path=/baidu/**
#            - Method=GET,POST
#
#        # 路由4：复杂多条件验证
#        - id: id-002
#          uri: http://www.qq.com
#          predicates:
#            - Cookie=myCookie,regex
#            - Header=myHeaderA
#            - Header=myHeaderB,regex
#            - Query=paramA
#            - Query=paramB,regex
#            - RemoteAddr=192.168.1.0/24
#            - Host=**.example.com
#
#        # 路由5：时间条件路由
#        - id: id-003
#          uri: http://seckill.zhaowa.com
#          predicates:
#            # 注意：YAML中不支持.or()的OR逻辑
#            # 需要创建多个路由来实现OR效果
#            - Before=2025-12-25T14:33:47.789+08:00[Asia/Shanghai]
#
